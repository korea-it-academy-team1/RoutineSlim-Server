# 로컬 개발용 설정 예시.
# 이 파일을 복사해 application-local.yml 로 이름을 바꾸고 각자 값에 맞게 고친다.
# application-local.yml 은 Git에 올리지 않는다 (.gitignore).
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/routineslim?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: routineslim
    password: ${DB_PASSWORD:routineslim}
  jpa:
    show-sql: true

# [JWT 로그인 - 이대수] 로컬 개발용 토큰 서명 키 (32자 이상). 아무 문자열로 바꿔도 된다
# 배포(prod)에서는 이 값을 쓰지 않고 환경 변수 JWT_SECRET 을 쓴다
# (1번 방식에서는 쓰지 않음. JWT 로 바꿀 때 아래 두 줄 맨 앞의 # 한 글자만 지운다)
#jwt:
#  secret: local-dev-secret-key-routineslim-0123456789
