# 로컬 개발용 설정 예시.
# 이 파일을 복사해 application-local.yml 로 이름을 바꾸고 각자 값에 맞게 고친다.
# application-local.yml 은 Git에 올리지 않는다 (.gitignore).
# application-local.yml (Git 제외)
spring:
  datasource:
    url: jdbc:mysql://routineslim-db-routineslim.k.aivencloud.com:22960/routineslim?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: routineslim
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    show-sql: true
# CLOVA OCR (영수증 스캔). 네이버 클라우드 콘솔 > CLOVA OCR > 영수증 도메인 > API Gateway 연동 값
clova:
  ocr:
    url: https://xxxx.apigw.ntruss.com/custom/v1/{도메인ID}/{InvokeKey}/document/receipt
    secret: 발급받은_Secret_Key

# [소셜 로그인 - 권기쁨] 카카오·네이버 로그인 키 (서버에서 인가 코드 → 토큰 교환에 사용)
# 카카오: Kakao Developers > 내 애플리케이션 > 앱 키 > REST API 키 / 보안 > Client Secret(사용할 때만)
# 네이버: NAVER Developers > 내 애플리케이션 > Client ID / Client Secret
social:
  kakao:
    client-id: 카카오_REST_API_키
    client-secret:
  naver:
    client-id: 네이버_Client_ID
    client-secret: 네이버_Client_Secret

# [JWT 로그인 - 이대수] 로컬 개발용 토큰 서명 키 (32자 이상). 아무 문자열로 바꿔도 된다
# 배포(prod)에서는 이 값을 쓰지 않고 환경 변수 JWT_SECRET 을 쓴다

# JWT 로그인 설정 예시
# 실제 비밀키는 환경 변수 JWT_SECRET으로 설정
jwt:
  secret: ${JWT_SECRET}
