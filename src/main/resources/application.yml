# 공통 설정. 환경별 값은 application-local.yml / application-prod.yml 에 둔다.
spring:
  application:
    name: routineslim
  profiles:
    # 따로 지정하지 않으면 local 프로필로 실행한다 (서버에서는 SPRING_PROFILES_ACTIVE=prod)
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 마이그레이션으로만 만들고, JPA는 엔티티와 테이블이 맞는지만 검사한다
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  mvc:
    # 에러 응답을 RFC 9457 ProblemDetail(JSON) 형식으로 보낸다
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # 영수증 이미지 업로드 크기 제한
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# CLOVA OCR (영수증 스캔). 값은 application-local.yml 또는 서버 환경 변수로 넣는다.
# 비어 있으면 스캔 API가 503(설정 안 됨)을 돌려준다.
clova:
  ocr:
    url: ${CLOVA_OCR_URL:}
    secret: ${CLOVA_OCR_SECRET:}
    connect-timeout: 3s
    read-timeout: 15s

# JWT 인증
jwt:
  secret: ${JWT_SECRET}
